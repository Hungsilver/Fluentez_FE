    <nz-form-item>
      <nz-form-label [nzSpan]="24" nzRequired>Email</nz-form-label>
      <nz-form-control [nzSpan]="24" nzErrorTip="Please input your email!">
        <input
          nz-input
          formControlName="email"
          placeholder="Enter your email"
          type="email"
        />
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label [nzSpan]="24" nzRequired>Password</nz-form-label>
      <nz-form-control [nzSpan]="24" nzErrorTip="Please input your password!">

          nz-input
          formControlName="password"
          placeholder="Enter your password"
          type="password"
        />
      </nz-form-control>
    </nz-form-item>
    <div>

    </div>
    
    <button
      nz-button
      nzType="primary"
      class="w-100 my-2"
      [disabled]="!formInput.valid"
      type="submit"
    >
      Login to your account
    </button>
    <div>
      <span>Don't have an account yet ? </span>
