  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <div class="logo-wrapper">
        <img src="/assets/images/Fluentez_text.png" alt="Fluentez" class="logo-img" />
      </div>
      <h1 class="login-title">Chào mừng trở lại!</h1>
      <p class="login-subtitle">Đăng nhập để tiếp tục học tập</p>
    </div>

    <!-- Social Login Buttons -->
    <div class="social-login-section">
      <asl-google-signin-button
        type="standard"
        size="large"
        text="signin_with"
        shape="rectangular"
        theme="outline"
        [width]="280"
      ></asl-google-signin-button>
      <button type="button" class="social-btn facebook-btn" (click)="loginWithFacebook()">

          src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAACXBIWXMAAACxAAAAsQHGLUmNAAAAGXRFWHRTb2Z0d2FyZQB3d3cuaW5rc2NhcGUub3Jnm+48GgAAAsVJREFUSImtlktoE2sUx3/nm0mLqeOjgkqSVqEKiogu3KgrwY268LHwIngREdGV7hJQ8QE+2uhSFwqCVlz46BVF4bq6F0Rx4cbrovhY9JGmKWqsjcY2mZmzF03LGNNOrf533/+c8z/n++Y/840wCWKpfLOHtVUwW0AXA4lKKAPShfoPTSRyP3sm2juRhtQiE0eL8XLZPS7CPsCabAjABzoQL5lrndsV2iCWHNrmCzeAmSHC1SiosnsgPetBkDTBxYLU58O+0DENcQBHhHsLkp8PBcnxHVQm76huWg0j+KubzduWedbQ1xG1+4f8hs6cNg2XdUYlxVdl+9hOBCCeLCY8cTvDJt+4zPrv6p/RWXUWi4P8yUfDzy4/Ka8LUAVXrWUf0g1ZA+CJeypMfOl8q7t9T7SlWnwCOBG8UwAmlso3A3vCKi7sqO8WoSHIKXwqedo7WNRIdb4Ke+PJYsIe9XmoFVkRM/OD69N/jzy99G9pPTAXaKpRYnnibTWisjlMHKDOlvHpfeV9RXxyqG42CEum0kACjvOVkanUILQYYOGUkqeHuCxMDX2B7x/eGPrOzcwbkcYwlbXnv2a6PvqJGqGCAQZ+ccpvPXk/VisgkDPA619RHy7T62vtt1/hja3oY0E21Uq49tx9Fa04/I81kVUCcyqFg7delF8CvMp69RM1V/SxxFL5Zh/7HfDDyxJE71knY5vR+8D1yTQdKdQ68yBKltotJtvW2APcDEn+aYjS3peOZgyAwT0BfPqN+nmDPfotAsi2NfYgcgDQ3yCuorK/Lx3NjDcAyLU6d0TkIKNX4LTFUT3Un3b+GiO+s1d/q3MFZBfTO648Kjtz6dkXg+QP/s21Obdt214JtAOlKQiXEK67aq3MpZ271cGafxVjSBwtxj2vvFNVNnSfdmJ1NssBSi6di44VsiL6T9m3b31IN2Qn0vgfVQr3Gl3992kAAAAASUVORK5CYII="
          alt="Facebook"
          class="social-icon"
        />
        <span>Đăng nhập với Facebook</span>
      </button>
    </div>

    <!-- Divider -->
    <div class="divider-wrapper">
      <div class="divider-line"></div>
      <span class="divider-text">hoặc</span>
      <div class="divider-line"></div>
    </div>

    <!-- Login Form -->
    <form nz-form [formGroup]="formInput" (ngSubmit)="onSubmit()" class="login-form">
      <nz-form-item>
        <nz-form-control [nzSpan]="24" nzErrorTip="Vui lòng nhập email hợp lệ!">
          <input
            nz-input
            formControlName="email"
            placeholder="Email của bạn"
            type="email"
            class="form-input"
            [class.error]="formInput.get('email')?.invalid && formInput.get('email')?.touched"
          />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-control [nzSpan]="24" nzErrorTip="Vui lòng nhập mật khẩu!">
          <input
            nz-input
            formControlName="password"
            placeholder="Mật khẩu"
            type="password"
            class="form-input"
            [class.error]="formInput.get('password')?.invalid && formInput.get('password')?.touched"
          />
        </nz-form-control>
      </nz-form-item>

      <div class="form-footer">
        <a class="forgot-link" routerLink="/auth/forgot-password">Quên mật khẩu?</a>
      </div>
      
      <button
        nz-button
        nzType="primary"
        nzSize="large"
        class="submit-btn"
        [disabled]="!formInput.valid || isLoading"
        [nzLoading]="isLoading"
        type="submit"
      >
        Đăng nhập
      </button>
    </form>

    <!-- Footer Links -->
    <div class="login-footer">
      <span class="footer-text">Chưa có tài khoản? </span>
      <a class="footer-link" routerLink="/auth/register">Đăng ký ngay</a>
    </div>
    <div class="home-link-wrapper">
      <a class="home-link" routerLink="/">
        <span nz-icon nzType="home" nzTheme="outline"></span>
        Về trang chủ
      </a>
    </div>
  </div>
</div>
