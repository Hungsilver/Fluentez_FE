<nz-layout class="app-layout">
  <nz-sider
    class="menu-sidebar"
    nzCollapsible
    nzWidth="256px"
    nzBreakpoint="md"
    nzTheme="light"
    [(nzCollapsed)]="isCollapsed"
    [nzTrigger]="null"
  >
    <div class="sidebar-logo">
      <a routerLink="/">
        <img src="/assets/images/Fluentez_img.png" alt="logo" />
        <h1 class="text-dark">Hưng Silver</h1>
      </a>
    </div>
    <ul
      nz-menu
      nzTheme="light"
      nzMode="inline"
      [nzInlineCollapsed]="isCollapsed"
    >
      <li
        nz-menu-item
        nz-tooltip
        nzTooltipPlacement="right"
        [nzTooltipTitle]="isCollapsed ? 'Dashboard' : ''"
        nzSelected
      >
        <a routerLink="">
          <span nz-icon nzType="dashboard" nzTheme="outline"></span>
          <span>Dashboard</span>
        </a>
      </li>
      <li nz-submenu [nzTitle]="titleCourses">
        <ng-template #titleCourses>
          <span nz-icon nzType="read" nzTheme="outline"> </span
          ><span>Courses</span>
        </ng-template>
        <ul>
          <!-- <li *ngFor="let item of menus" nz-menu-item nzMatchRouter>
            <a [routerLink]="'/'+item.title+'/'+item.id">{{item.title}}</a>
          </li> -->
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/grammar">Grammar</a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/welcome">Listening</a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/welcome">Reading</a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/welcome">Writing</a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/welcome">Speaking</a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/welcome">IELTS <span>7.5+</span></a>
          </li>
        </ul>
      </li>

      <li
        nz-menu-item
        nz-tooltip
        nzTooltipPlacement="right"
        [nzTooltipTitle]="isCollapsed ? 'Messenger' : ''"
        [nzSelected]="false"
      >
        <a routerLink="">
          <span nz-icon nzType="message" nzTheme="outline"></span>
          <span>Messenger</span>
        </a>
      </li>
      <li
        nz-menu-item
        nz-tooltip
        nzTooltipPlacement="right"
        [nzTooltipTitle]="isCollapsed ? 'Vocabulary' : ''"
        [nzSelected]="false"
      >
        <a routerLink="">
          <span nz-icon nzType="book" nzTheme="outline"></span>
          <span>Vocabulary</span>
        </a>
      </li>
    </ul>
    <div class="d-flex justify-content-end">
      <span class="header-trigger" (click)="isCollapsed = !isCollapsed">
        <span
          class="trigger"
          nz-icon
          [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"
        ></span>
      </span>
    </div>
  </nz-sider>
  <nz-layout>
    <app-header></app-header>
    <nz-content>
      <div class="inner-content">
        <router-outlet></router-outlet>
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
